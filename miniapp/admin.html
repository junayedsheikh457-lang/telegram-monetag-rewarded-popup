<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reward Center • Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#070b16;color:#fff;min-height:100vh}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 10% 0%,#1d4ed8,transparent 28%),radial-gradient(circle at 100% 0%,#7c3aed,transparent 25%);opacity:.45;pointer-events:none}.app{position:relative;max-width:1100px;margin:auto;padding:28px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.brand-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#3b82f6,#7c3aed);font-size:24px}.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:#8f9bb2;font-size:12px}.login{display:flex;gap:8px;max-width:390px;width:100%}input,button{border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 13px;background:rgba(15,23,42,.8);color:#fff;outline:none}input{flex:1;min-width:0}button{cursor:pointer;font-weight:750;background:linear-gradient(135deg,#3b82f6,#7c3aed)}button:hover{filter:brightness(1.08)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat,.panel{background:rgba(15,23,42,.78);border:1px solid rgba(255,255,255,.09);border-radius:20px;box-shadow:0 18px 55px rgba(0,0,0,.25);backdrop-filter:blur(14px)}.stat{padding:19px}.stat span{color:#8f9bb2;font-size:12px}.stat strong{display:block;font-size:25px;margin-top:7px}.panel{padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.panel h2{font-size:16px;margin:0}.hint{font-size:11px;color:#7f8ba1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px}th{color:#7f8ba1;font-weight:600}td{color:#d7deea}.money{color:#86efac;font-weight:800}.actions{display:flex;gap:7px;align-items:center}.actions input{width:105px}.actions button{padding:9px 11px;font-size:11px}.msg{min-height:20px;color:#93c5fd;font-size:12px;margin-top:8px}@media(max-width:720px){.top{align-items:flex-start;flex-direction:column}.login{max-width:none}.grid{grid-template-columns:1fr}.stat{padding:15px}.app{padding:20px 12px}.panel{padding:12px}}</style></head><body><main class="app"><header class="top"><div class="brand"><div class="brand-icon">⚙️</div><div><h1>Reward Center Admin</h1><p>Users, rewards & balance management</p></div></div><div class="login"><input id="pw" type="password" placeholder="Admin password"><button onclick="load()">Login</button></div></header><section class="grid"><div class="stat"><span>👥 Total Users</span><strong id="usersCount">—</strong></div><div class="stat"><span>🎁 Total Ads</span><strong id="adsCount">—</strong></div><div class="stat"><span>💰 Total Balance</span><strong id="balanceTotal">—</strong></div></section><section class="panel"><div class="panel-head"><h2>👥 User Management</h2><span class="hint">Top 200 users by balance</span></div><div id="msg" class="msg">Password দিয়ে Login করো।</div><div class="table-wrap" id="users"></div></section></main><script>let password='';const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));const headers=()=>({'X-Admin-Password':password,'Content-Type':'application/json'});async function load(){password=document.getElementById('pw').value;if(!password)return;document.getElementById('msg').textContent='লোড হচ্ছে…';let s=await fetch('/api/admin/stats',{headers:headers()});if(!s.ok){document.getElementById('msg').textContent='❌ Password ভুল অথবা access denied';return}let d=await s.json();document.getElementById('usersCount').textContent=d.users;document.getElementById('adsCount').textContent=d.ads;document.getElementById('balanceTotal').textContent='৳'+Number(d.balance).toFixed(2);let r=await fetch('/api/admin/users',{headers:headers()}),u=await r.json();document.getElementById('users').innerHTML='<table><thead><tr><th>Telegram ID</th><th>User</th><th>Name</th><th>Balance</th><th>Quick Adjust</th></tr></thead><tbody>'+u.items.map(x=>`<tr><td>${esc(x.telegram_id)}</td><td>${x.username?'@'+esc(x.username):'—'}</td><td>${esc(x.first_name)||'—'}</td><td class="money">৳${Number(x.balance).toFixed(2)}</td><td><div class="actions"><input id="a-${esc(x.telegram_id)}" type="number" step="0.01" placeholder="± amount"><button onclick="adjust('${esc(x.telegram_id)}')">Update</button></div></td></tr>`).join('')+'</tbody></table>';document.getElementById('msg').textContent='✅ Dashboard ready';}async function adjust(id){let el=document.getElementById('a-'+id),amount=Number(el.value);if(!amount)return;let r=await fetch('/api/admin/balance',{method:'POST',headers:headers(),body:JSON.stringify({user_id:id,amount})});if(r.ok){el.value='';document.getElementById('msg').textContent='✅ Balance updated';load()}else document.getElementById('msg').textContent='❌ Update failed'}document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')load()});</script></body></html>
