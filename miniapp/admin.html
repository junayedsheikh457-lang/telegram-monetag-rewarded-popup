<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:system-ui;margin:0;background:#0d1726;color:#fff;padding:20px}.box{max-width:900px;margin:auto}input,button{padding:12px;border-radius:8px;border:0;margin:4px}button{cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:15px}td,th{padding:9px;border-bottom:1px solid #334}</style></head><body><div class="box"><h2>⚙️ Reward Admin</h2><input id="pw" type="password" placeholder="Admin password"><button onclick="load()">Login</button><div id="stats"></div><div id="users"></div></div><script>let H=()=>({'X-Admin-Password':document.getElementById('pw').value});async function load(){let o={headers:H()};let s=await fetch('/api/admin/stats',o);if(!s.ok)return alert('Password ভুল');let d=await s.json();document.getElementById('stats').innerHTML=`<p>Users: ${d.users} | Ads: ${d.ads} | Total balance: ৳${d.balance.toFixed(2)}</p>`;let u=await (await fetch('/api/admin/users',o)).json();document.getElementById('users').innerHTML='<table><tr><th>ID</th><th>Username</th><th>Balance</th></tr>'+u.items.map(x=>`<tr><td>${x.telegram_id}</td><td>@${x.username||'-'}</td><td>৳${Number(x.balance).toFixed(2)}</td></tr>`).join('')+'</table>'}</script></body></html>
