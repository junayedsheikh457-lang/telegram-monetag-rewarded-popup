<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Reward Center</title><link rel="stylesheet" href="style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src='//libtl.com/sdk.js' data-zone='11677828' data-sdk='show_11677828'></script></head><body><main class="wrap"><section class="card"><div class="hero"><div class="logo">🎁</div><div><h1>Reward Center</h1><p class="sub">অ্যাড দেখে সহজেই রিওয়ার্ড নাও</p></div></div><div class="balance"><span>💰 তোমার ব্যালেন্স</span><b>৳<i id="balance">0.00</i></b></div><button class="watch" id="watch">▶️ অ্যাড দেখো & রিওয়ার্ড নাও</button><p id="status">Rewarded ad চালু করতে উপরের বাটনে চাপ দাও</p><div class="info">✨ প্রতি verified ad: <strong>৳0.05</strong><br>🔒 Ad verification সম্পন্ন হওয়ার পর reward balance-এ যোগ হবে।</div><h3>📜 সাম্প্রতিক রিওয়ার্ড</h3><div id="history" class="history">লোড হচ্ছে…</div></section></main><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const $=id=>document.getElementById(id);let userId=null,nonce=null,initData='';async function init(){initData=tg?.initData||'';if(!initData){$('status').textContent='⚠️ Telegram Mini App থেকেই খুলতে হবে।';return}try{let r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData})});let d=await r.json();if(!r.ok)throw Error(d.error||'verification');userId=d.user_id;nonce=d.nonce;await refresh()}catch(e){$('status').textContent='❌ Telegram verification ব্যর্থ হয়েছে।'}}async function refresh(){if(!userId)return;try{let r=await fetch('/api/me?user_id='+encodeURIComponent(userId));let d=await r.json();$('balance').textContent=Number(d.balance||0).toFixed(2);let h=await fetch('/api/history?user_id='+encodeURIComponent(userId));let x=await h.json();$('history').innerHTML=x.items?.length?x.items.map(a=>`<div><span>🎁 ${a.source}</span><b>+৳${Number(a.amount).toFixed(2)}</b></div>`).join(''):'<div class="empty">এখনো কোনো reward নেই।</div>'}catch(e){}}$('watch').onclick=async()=>{if(!userId||!nonce)return;$('watch').disabled=true;$('status').textContent='⏳ Ad খোলা হচ্ছে…';try{if(typeof window.show_11677828!=='function')throw Error('not-ready');await window.show_11677828({ymid:String(nonce)});$('status').textContent='✅ Ad শেষ। Server verification-এর জন্য অপেক্ষা করো…';setTimeout(refresh,5000);setTimeout(refresh,12000)}catch(e){$('status').textContent='❌ Ad complete হয়নি। Reward যোগ করা হয়নি।'}finally{setTimeout(()=>{$('watch').disabled=false},6000)}};init();</script></body></html>
