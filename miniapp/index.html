<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reward Center</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag Rewarded Popup - your zone -->
  <script src='//libtl.com/sdk.js' data-zone='11677828' data-sdk='show_11677828'></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="icon">🎁</div>
      <h1>অ্যাড দেখে রিওয়ার্ড নাও</h1>
      <div class="balance-box">
        <span>বর্তমান ব্যালেন্স</span>
        <strong><span id="balance">0.00</span> ৳</strong>
      </div>
      <button id="watchAdBtn" class="btn">▶ অ্যাড দেখো</button>
      <p id="status" class="status">বাটনে চাপ দিয়ে rewarded ad চালু করো</p>
      <p class="note">রিওয়ার্ড শুধু verified ad event-এর পর server থেকে যোগ হবে।</p>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    const userId = tg?.initDataUnsafe?.user?.id;
    const balanceEl = document.getElementById('balance');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('watchAdBtn');

    function status(text) { statusEl.textContent = text; }

    async function loadBalance() {
      if (!userId) return;
      try {
        const res = await fetch('/api/me?user_id=' + encodeURIComponent(userId));
        if (!res.ok) return;
        const data = await res.json();
        balanceEl.textContent = Number(data.balance || 0).toFixed(2);
      } catch (_) {}
    }

    async function watchAd() {
      if (!userId) {
        status('Telegram থেকে Mini App খুলতে হবে।');
        return;
      }
      if (typeof window.show_11677828 !== 'function') {
        status('Monetag ad এখনো ready হয়নি। একটু পরে চেষ্টা করো।');
        return;
      }

      btn.disabled = true;
      status('Ad খোলা হচ্ছে…');
      try {
        await window.show_11677828({ ymid: String(userId) });
        status('Ad শেষ হয়েছে। Verification-এর জন্য অপেক্ষা করো…');
        await new Promise(resolve => setTimeout(resolve, 2500));
        await loadBalance();
        status('Verified balance আপডেট হয়েছে।');
      } catch (err) {
        console.error(err);
        status('Ad complete হয়নি। কোনো reward যোগ করা হয়নি।');
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', watchAd);
    loadBalance();
  </script>
</body>
</html>
