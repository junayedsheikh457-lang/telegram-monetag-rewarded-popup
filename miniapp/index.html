<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Earn by Watching Ads</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Monetag Rewarded Popup Script -->
  <script src='//libtl.com/sdk.js' data-zone='11677828' data-sdk='show_11677828'></script>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <h1>🎁 অ্যাড দেখে ইনকাম করো</h1>
    <p class="balance">তোমার ব্যালেন্স: <span id="balance">0.00</span> ৳</p>

    <button id="watchAdBtn" class="btn">অ্যাড দেখো ও রিওয়ার্ড নাও</button>

    <p class="note">অ্যাড দেখার পর রিওয়ার্ড অটো যোগ হবে</p>
  </div>

  <script>
    // Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // ইউজার আইডি
    const userId = tg.initDataUnsafe?.user?.id || "guest_" + Date.now();

    // ব্যালেন্স (লোকাল স্টোরেজ - ডেমো)
    let balance = parseFloat(localStorage.getItem("balance") || "0");
    document.getElementById("balance").innerText = balance.toFixed(2);

    document.getElementById("watchAdBtn").addEventListener("click", function () {
      if (typeof show_11677828 === "function") {
        show_11677828({
          ymid: userId.toString()
        }).then(() => {
          // অ্যাড সফলভাবে দেখানো হয়েছে
          balance += 0.05; // ডেমো রিওয়ার্ড (পরে পোস্টব্যাক দিয়ে কন্ট্রোল করবে)
          localStorage.setItem("balance", balance);
          document.getElementById("balance").innerText = balance.toFixed(2);
          tg.showAlert("রিওয়ার্ড পেয়েছো! +0.05 ৳");
        }).catch((err) => {
          console.log(err);
          tg.showAlert("অ্যাড পাওয়া যায়নি। একটু পর আবার চেষ্টা করো।");
        });
      } else {
        tg.showAlert("Monetag script এখনো লোড হয়নি। একটু অপেক্ষা করে আবার চেষ্টা করো।");
      }
    });
  </script>
</body>
</html>
