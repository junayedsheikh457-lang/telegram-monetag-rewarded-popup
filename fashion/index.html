<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Women's Fashion Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f8;color:#222}.header{background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #0001}.nav{max-width:1200px;margin:auto;padding:14px 18px;display:flex;gap:18px;align-items:center}.logo{font-size:24px;font-weight:800;white-space:nowrap}.search{flex:1;padding:12px 18px;border:1px solid #ddd;border-radius:25px;font-size:15px}.cart{border:0;background:#111;color:#fff;padding:11px 15px;border-radius:22px}.hero{max-width:1200px;margin:18px auto;padding:42px 7%;border-radius:18px;background:linear-gradient(120deg,#fde7ef,#eee4ff)}.hero h1{font-size:38px;margin:0 0 10px}.hero p{font-size:17px;margin-bottom:22px}.shop{border:0;background:#111;color:#fff;padding:13px 22px;border-radius:8px;font-weight:700}.cats{max-width:1200px;margin:auto;padding:0 18px 12px;display:flex;gap:10px;overflow:auto}.cats button{border:1px solid #ddd;background:#fff;padding:10px 17px;border-radius:22px;white-space:nowrap}.wrap{max-width:1200px;margin:auto;padding:10px 18px 40px}.heading{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px #00000012}.photo{height:260px;background:linear-gradient(135deg,#eee,#ddd);display:flex;align-items:center;justify-content:center;color:#999}.info{padding:14px}.name{font-weight:700;min-height:40px}.price{font-size:20px;font-weight:800;margin-top:8px}.old{text-decoration:line-through;color:#999;font-size:13px;margin-left:6px}.add{width:100%;padding:11px;margin-top:10px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700}.badge{display:inline-block;background:#111;color:#fff;padding:5px 8px;border-radius:5px;font-size:11px;margin-top:5px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:30px}.photo{height:220px}}@media(max-width:520px){.nav{gap:8px}.logo{font-size:18px}.search{min-width:80px}.cart{padding:9px 11px}.grid{gap:10px}.photo{height:190px}.wrap{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<header class="header"><div class="nav"><div class="logo">FASHION STORE</div><input id="search" class="search" placeholder="পণ্য খুঁজুন..."><button class="cart">🛒 <span id="count">0</span></button></div></header>
<section class="hero"><h1>নতুন ফ্যাশন কালেকশন ✨</h1><p>১ পিস, ২ পিস ও ৩ পিস—আপনার পছন্দের ড্রেস এক জায়গায়।</p><button class="shop" onclick="document.getElementById('products').scrollIntoView()">Shop Now</button></section>
<div class="cats"><button onclick="filter('all')">সব পণ্য</button><button onclick="filter('1 Piece')">১ পিস</button><button onclick="filter('2 Piece')">২ পিস</button><button onclick="filter('3 Piece')">৩ পিস</button><button onclick="filter('Abaya')">আবায়া</button><button onclick="filter('Offer')">অফার</button></div>
<main class="wrap" id="products"><div class="heading"><h2>All Products</h2><span id="total"></span></div><div class="grid" id="grid"></div></main>
<script>
const products=[['Elegant Three Piece','3 Piece',899,1199],['Premium Two Piece','2 Piece',749,999],['Stylish One Piece','1 Piece',699,899],['Floral Three Piece','3 Piece',999,1399],['Classic Abaya','Abaya',1099,1499],['Modern One Piece','1 Piece',799,999],['Premium Two Piece','2 Piece',849,1099],['Party Wear Three Piece','3 Piece',1299,1699],['Daily Wear One Piece','1 Piece',649,849],['Elegant Abaya','Abaya',1199,1599],['Special Offer Dress','Offer',599,899],['Luxury Three Piece','3 Piece',1499,1999]];
let current='all',cart=0;
function render(){let q=document.getElementById('search').value.toLowerCase();let a=products.filter(p=>(current==='all'||p[1]===current)&&p[0].toLowerCase().includes(q));document.getElementById('total').textContent=a.length+' items';document.getElementById('grid').innerHTML=a.map((p,i)=>`<article class="card"><div class="photo">Dress Image</div><div class="info"><div class="name">${p[0]}</div><span class="badge">${p[1]}</span><div class="price">৳${p[2]} <span class="old">৳${p[3]}</span></div><button class="add" onclick="add()">Add to Cart</button></div></article>`).join('')||'<p>কোনো পণ্য পাওয়া যায়নি।</p>'}
function filter(x){current=x;render()}function add(){cart++;document.getElementById('count').textContent=cart;alert('পণ্যটি Cart-এ যোগ হয়েছে।')}
document.getElementById('search').addEventListener('input',render);render();
</script></body></html>
