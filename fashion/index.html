<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FASHION STORE</title><style>:root{--ink:#17151a;--muted:#777078;--line:#eee6ea;--pink:#b53f68}*{box-sizing:border-box}body{margin:0;background:#fcfafb;color:var(--ink);font-family:Arial,sans-serif}.nav{position:sticky;top:0;z-index:10;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px max(14px,calc((100% - 1200px)/2));display:flex;gap:12px;align-items:center}.brand{font-weight:800;min-width:170px}.brand small{display:block;color:#999;font-size:9px;letter-spacing:2px}.search{flex:1;border:1px solid var(--line);background:#f8f5f7;border-radius:25px;padding:12px 16px}.cart{border:0;border-radius:22px;background:#17151a;color:white;padding:10px 15px}.hero,.content{max-width:1200px;margin:auto;padding:20px 14px}.heroBox{border-radius:28px;padding:55px;background:linear-gradient(115deg,#f8e2eb,#f1eaf5);min-height:330px}.hero h1{font:clamp(42px,7vw,72px)/1.05 Georgia;margin:0 0 12px}.hero em{color:var(--pink);font-style:normal}.hero p{color:#665e63;max-width:570px;line-height:1.7}.shop{background:#17151a;color:#fff;border:0;padding:13px 20px;border-radius:10px}.cats{display:flex;gap:8px;overflow:auto;max-width:1200px;margin:auto;padding:0 14px 15px}.cat{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:22px;padding:10px 16px}.cat.active{background:#17151a;color:#fff}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.head h2{font:34px Georgia;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden}.photo{height:300px;background:#f0ebee;position:relative;cursor:pointer}.photo img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;left:10px;top:10px;background:#fff;padding:6px 9px;border-radius:8px;font-size:10px;font-weight:800}.info{padding:13px}.name{font-weight:750;min-height:38px}.row{display:flex;justify-content:space-between;align-items:center}.price{font-size:19px;font-weight:850}.old{text-decoration:line-through;color:#aaa;font-size:11px}.add{width:100%;margin-top:11px;border:0;border-radius:9px;padding:11px;background:#f2edf0;font-weight:750;cursor:pointer}.detail{display:none;position:fixed;inset:0;z-index:50;background:#0009;padding:15px;overflow:auto}.detail.show{display:flex;justify-content:center;align-items:flex-start}.detailBox{background:#fff;border-radius:22px;width:min(950px,100%);margin:20px auto;padding:18px;position:relative}.close{position:absolute;right:15px;top:10px;border:0;background:#17151a;color:#fff;border-radius:50%;width:35px;height:35px;font-size:22px;z-index:2}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.mainImg{width:100%;height:480px;object-fit:cover;border-radius:15px;background:#f0ebee}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumb{width:70px;height:80px;object-fit:cover;border:2px solid transparent;border-radius:8px;cursor:pointer}.thumb.active{border-color:var(--pink)}.detailInfo h2{font:34px Georgia;margin:20px 0 10px}.detailPrice{font-size:28px;font-weight:850}.detailInfo p{color:#666;line-height:1.7}.related{margin-top:30px}.related h3{font:26px Georgia}.relatedGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.relatedCard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer}.relatedCard img{width:100%;height:180px;object-fit:cover}.relatedCard b{display:block;padding:8px;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:60;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;border-radius:18px;padding:20px;width:min(520px,100%)}.box input,.box textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid var(--line);border-radius:9px}.primary{width:100%;padding:12px;border:0;border-radius:10px;background:#17151a;color:#fff}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.detailGrid{grid-template-columns:1fr}.mainImg{height:380px}.relatedGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.brand{min-width:auto;font-size:14px}.brand small{display:none}.heroBox{padding:30px 22px}.grid{gap:9px}.photo{height:220px}.head h2{font-size:27px}.relatedCard img{height:130px}}</style></head><body><nav class="nav"><div class="brand">FASHION STORE<small>WOMEN'S COLLECTION</small></div><input id="search" class="search" placeholder="পণ্য খুঁজুন..." oninput="load()"><button class="cart" onclick="openCart()">🛒 <span id="cc">0</span></button></nav><section class="hero"><div class="heroBox"><h1>আপনার স্টাইল,<br><em>আপনার গল্প।</em></h1><p>১ পিস, ২ পিস, ৩ পিস ও আবায়ার সুন্দর কালেকশন—আপনার পছন্দের fashion এক জায়গায়।</p><button class="shop" onclick="document.getElementById('products').scrollIntoView()">এখনই শপ করুন →</button></div></section><div class="cats"><button class="cat active" onclick="filter('all',this)">সব</button><button class="cat" onclick="filter('1 Piece',this)">১ পিস</button><button class="cat" onclick="filter('2 Piece',this)">২ পিস</button><button class="cat" onclick="filter('3 Piece',this)">৩ পিস</button><button class="cat" onclick="filter('Abaya',this)">আবায়া</button><button class="cat" onclick="filter('Offer',this)">অফার</button></div><main id="products" class="content"><div class="head"><div><h2>Featured Collection</h2><span>নতুন কালেকশন</span></div><span id="count"></span></div><div id="grid" class="grid"></div></main><div id="detail" class="detail"></div><div id="cart" class="modal"><div class="box"><h2>অর্ডার করুন 🛍️</h2><div id="cartItems"></div><input id="customer" placeholder="আপনার নাম"><input id="phone" placeholder="মোবাইল নম্বর"><textarea id="address" rows="3" placeholder="ডেলিভারি ঠিকানা"></textarea><button class="primary" onclick="order()">অর্ডার কনফার্ম</button></div></div><script>const API='https://telegram-monetag.onrender.com';let products=[],cat='all',cart=[];const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>\'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m])),money=n=>'৳'+Number(n).toLocaleString('en-IN');function imgs(p){let a=Array.isArray(p.gallery)?p.gallery:[];if(p.image&&!a.includes(p.image))a.unshift(p.image);return a.slice(0,6)}async function load(){try{let q=encodeURIComponent($('search').value||''),c=cat==='all'?'all':encodeURIComponent(cat),r=await fetch(API+'/api/fashion/products?category='+c+'&q='+q);products=(await r.json()).items||[];render()}catch(e){$('grid').innerHTML='<p>পণ্য লোড করা যাচ্ছে না।</p>'}}function render(){$('count').textContent=products.length+'টি পণ্য';$('grid').innerHTML=products.map(p=>{let im=imgs(p)[0]||'';return `<article class="card"><div class="photo" onclick="details(${p.id})">${im?`<img src="${esc(im)}" alt="${esc(p.name)}">`:''}<span class="tag">${p.old_price>p.price?'SALE':'NEW'}</span></div><div class="info"><div class="name">${esc(p.name)}</div><div class="row"><div class="price">${money(p.price)} ${p.old_price?`<span class="old">${money(p.old_price)}</span>`:''}</div><small>${p.stock}টি</small></div><button class="add" onclick="add(${p.id})">🛒 Cart-এ যোগ করুন</button></div></article>`}).join('')||'<p>কোনো পণ্য নেই।</p>'}function filter(x,e){cat=x;document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active'));e.classList.add('active');load()}async function details(id){let p=products.find(x=>x.id===id);if(!p){let r=await fetch(API+'/api/fashion/products/'+id);let d=await r.json();p=d.product}if(!p)return;let a=imgs(p);$('detail').innerHTML=`<div class="detailBox"><button class="close" onclick="document.getElementById('detail').classList.remove('show')">×</button><div class="detailGrid"><div><img id="mainDetail" class="mainImg" src="${esc(a[0]||'')}" onerror="this.style.display='none'"><div class="thumbs">${a.map((x,i)=>`<img class="thumb ${i?'':'active'}" src="${esc(x)}" onclick="document.getElementById('mainDetail').style.display='block';document.getElementById('mainDetail').src=this.src;document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));this.classList.add('active')">`).join('')}</div></div><div class="detailInfo"><h2>${esc(p.name)}</h2><div class="detailPrice">${money(p.price)} ${p.old_price?`<span class="old">${money(p.old_price)}</span>`:''}</div><p>${esc(p.description||'সুন্দর premium fashion collection.')}</p><p><b>Stock:</b> ${p.stock}টি</p><button class="primary" onclick="add(${p.id});document.getElementById('detail').classList.remove('show')">🛒 Cart-এ যোগ করুন</button></div></div><div class="related"><h3>আরও পছন্দ হতে পারে</h3><div class="relatedGrid">${products.filter(x=>x.id!==p.id).slice(0,4).map(x=>{let u=imgs(x)[0]||'';return `<div class="relatedCard" onclick="details(${x.id})">${u?`<img src="${esc(u)}">`:''}<b>${esc(x.name)}</b></div>`}).join('')}</div></div></div>`;$('detail').classList.add('show')}function add(id){let p=products.find(x=>x.id===id);if(!p)return;let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id:p.id,name:p.name,price:p.price,qty:1});$('cc').textContent=cart.reduce((a,x)=>a+x.qty,0)}function openCart(){if(!cart.length)return alert('Cart খালি');$('cartItems').innerHTML=cart.map(x=>`<div>${esc(x.name)} × ${x.qty} — ${money(x.price*x.qty)}</div>`).join('');$('cart').classList.add('show')}async function order(){let b={customer_name:$('customer').value.trim(),phone:$('phone').value.trim(),address:$('address').value.trim(),items:cart,total:cart.reduce((a,x)=>a+x.price*x.qty,0)};if(!b.customer_name||!b.phone||!b.address)return alert('সব তথ্য পূরণ করুন');let r=await fetch(API+'/api/fashion/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let d=await r.json();if(d.ok){alert('অর্ডার সফল! Order #'+d.order_id);cart=[];$('cc').textContent=0;$('cart').classList.remove('show')}}load();</script></body></html>
