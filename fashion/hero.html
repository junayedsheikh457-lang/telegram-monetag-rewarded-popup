<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUXÉRA • Hero Settings</title>
<style>
:root{--pink:#ef3978;--gold:#e7bd55;--bg:#080808;--panel:#111;--line:#44341d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font:30px Georgia;color:var(--gold);letter-spacing:4px}.muted{color:#aaa;font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.slot{border:1px dashed #735a2d;border-radius:14px;padding:10px;background:#0b0b0b}.slot b{display:block;color:var(--gold);margin-bottom:8px}.slot input{width:100%;font-size:11px}.preview{width:100%;height:180px;object-fit:cover;border-radius:10px;background:#050505;margin-top:9px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--pink);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#29231b;border:1px solid #665020}.status{margin-top:12px;color:#f0d78e;font-size:13px;white-space:pre-wrap}.hint{font-size:11px;color:#999;line-height:1.5;margin-top:10px}@media(max-width:560px){.grid{grid-template-columns:1fr}.preview{height:220px}}
</style></head>
<body><main class="wrap">
<header class="top"><div><div class="brand">LUXÉRA</div><div class="muted">Hero Slider Settings</div></div><button class="btn secondary" onclick="location.href='/admin.html'">← Admin Panel</button></header>
<section class="panel"><h2>Homepage Hero Images</h2><div class="muted">এখানে ৩টি ছবি দাও। ওয়েবসাইটের Hero section-এ অটোমেটিক slide হবে।</div>
<div class="grid">
<label class="slot"><b>Image 01</b><input id="f0" type="file" accept="image/*" onchange="pick(0,this)"><img id="p0" class="preview" alt="Preview 1"></label>
<label class="slot"><b>Image 02</b><input id="f1" type="file" accept="image/*" onchange="pick(1,this)"><img id="p1" class="preview" alt="Preview 2"></label>
<label class="slot"><b>Image 03</b><input id="f2" type="file" accept="image/*" onchange="pick(2,this)"><img id="p2" class="preview" alt="Preview 3"></label>
</div>
<div class="row"><button class="btn" onclick="saveHero()">Save Hero Slider</button><button class="btn secondary" onclick="loadHero()">Reload</button></div>
<div id="status" class="status">প্রথমে Admin password দিয়ে Login করো।</div>
<div class="hint">ছবিগুলো browser-এই compress হবে। সর্বোচ্চ ৩টি ছবি রাখা হবে। Save করার পরে Home page reload করলেই slider দেখা যাবে।</div></section></main>
<script>
const API='https://telegram-monetag.onrender.com';let pass='',images=['','',''];const $=id=>document.getElementById(id);const status=x=>$('status').textContent=x;
function headers(){return {'X-Admin-Password':pass,'Content-Type':'application/json'}}
function resize(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height,max=1500;if(Math.max(w,h)>max){if(w>=h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',.84))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function pick(i,input){if(!input.files[0])return;status('ছবি প্রস্তুত হচ্ছে...');images[i]=await resize(input.files[0]);$('p'+i).src=images[i];status('ছবি ready। Save Hero Slider চাপো।')}
async function loadHero(){pass=prompt('Admin password দাও');if(!pass)return;status('Loading...');try{const r=await fetch(API+'/api/fashion/admin/products',{headers:headers()});if(!r.ok)throw Error('Password ভুল বা backend unavailable');const data=await r.json();const p=(data.items||[]).find(x=>String(x.name).trim().toUpperCase()==='__LUXERA_HERO__');if(p){images=(p.gallery||[]).slice(0,3);while(images.length<3)images.push('');images.forEach((x,i)=>{if(x)$('p'+i).src=x});status('আগের Hero images loaded।')}else status('নতুন Hero Slider তৈরি হবে।')}catch(e){status('❌ '+e.message)}}
async function saveHero(){if(!pass){await loadHero();if(!pass)return}const g=images.filter(Boolean).slice(0,3);if(!g.length)return status('কমপক্ষে ১টি ছবি দাও।');status('Saving...');try{const r0=await fetch(API+'/api/fashion/admin/products',{headers:headers()});if(!r0.ok)throw Error('Admin password/session সমস্যা');const all=await r0.json();const old=(all.items||[]).find(x=>String(x.name).trim().toUpperCase()==='__LUXERA_HERO__');const body={name:'__LUXERA_HERO__',category:'Offer',price:1,old_price:1,stock:1,image:g[0],gallery:g,description:'Homepage hero slider',active:1};const url=old?API+'/api/fashion/admin/products/'+old.id:API+'/api/fashion/admin/products';const r=await fetch(url,{method:old?'PUT':'POST',headers:headers(),body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Save failed');status('✅ Hero Slider saved successfully! Home page reload করো।')}catch(e){status('❌ '+e.message)}}
</script></body></html>
