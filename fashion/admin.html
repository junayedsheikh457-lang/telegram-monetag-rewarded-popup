<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fashion Store Admin</title><style>:root{--ink:#18151a;--pink:#d94672;--line:#eadfe4}*{box-sizing:border-box}body{margin:0;background:#faf7f8;color:var(--ink);font:14px Arial}.app{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.login{display:flex;gap:8px}.panel,.stat{background:#fff;border:1px solid #eee;border-radius:16px;padding:16px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{font-size:24px;display:block;margin-top:6px}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--ink);color:#fff}.pink{background:var(--pink)}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.form{display:none;background:#fff5f8;padding:14px;border-radius:14px;margin-top:14px}.form.show{display:block}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:11px;color:#756d74;display:block;margin-bottom:4px}.upload{border:2px dashed #e5cbd5;border-radius:14px;padding:14px;background:#fff;text-align:center}.upload input{border:0;padding:8px}.hint{font-size:11px;color:#756d74;margin:6px 0}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.gitem{position:relative;border:1px solid #eee;border-radius:10px;padding:5px;background:#fff}.gitem img{width:100%;height:120px;object-fit:cover;border-radius:7px}.gitem .remove{position:absolute;right:8px;top:8px;border:0;border-radius:50%;width:28px;height:28px;background:#fff;color:#c73535;cursor:pointer}.gitem small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:750px}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:12px}.thumb{width:55px;height:60px;object-fit:cover;border-radius:8px}.actions{display:flex;gap:6px}.danger{background:#fff!important;color:#c73535!important;border:1px solid #f1cccc!important}.toast{position:fixed;right:14px;bottom:14px;background:#18151a;color:#fff;padding:12px 15px;border-radius:10px;display:none;z-index:99}.toast.show{display:block}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}.gallery{grid-template-columns:1fr 1fr}.gitem img{height:145px}}</style></head><body><main class="app"><header class="top"><div><h1>👗 Fashion Store Admin</h1><small>Products & Orders</small></div><div class="login"><input id="pw" type="password" placeholder="Admin password"><button class="btn" onclick="login()">Login</button></div></header><p id="msg">Login করো।</p><section class="stats"><div class="stat">Products<b id="pc">—</b></div><div class="stat">Orders<b id="oc">—</b></div><div class="stat">Pending<b id="pending">—</b></div><div class="stat">Sales<b id="sales">—</b></div></section><div><button class="btn pink" onclick="tab('p')">Products</button> <button class="btn" onclick="tab('o')">Orders</button></div><section id="pp" class="panel"><button class="btn pink" onclick="openForm()">＋ Add Product</button><div id="form" class="form"><h3 id="formTitle">Add Product</h3><div class="fields"><div><label>Name</label><input id="name"></div><div><label>Category</label><select id="category"><option>1 Piece</option><option>2 Piece</option><option>3 Piece</option><option>Abaya</option><option>Offer</option></select></div><div><label>Sale Price</label><input id="price" type="number"></div><div><label>Old Price</label><input id="old" type="number"></div><div><label>Stock</label><input id="stock" type="number"></div><div><label>Cover Image URL (optional)</label><input id="image" placeholder="https://..."></div><div class="full"><label>📸 Gallery থেকে সরাসরি ছবি Upload</label><div class="upload"><input id="files" type="file" accept="image/*" multiple onchange="pickFiles(this)"><div class="hint">একসাথে সর্বোচ্চ ৬টি ছবি। প্রথম ছবিই Cover হবে। বড় ছবি browser-এই compress হবে।</div></div><div id="gallery" class="gallery"></div><div class="hint">URL দিয়েও ছবি দিতে পারবে। Upload করা ছবিগুলো Save Product চাপলে product gallery-তে সংরক্ষিত হবে।</div></div><div class="full"><label>Description</label><textarea id="desc" rows="4"></textarea></div></div><p><b id="photoCount">0</b>/6 ছবি selected</p><button class="btn pink" onclick="save()">Save Product</button> <button class="btn" onclick="closeForm()">Cancel</button></div><div id="products" class="table"></div></section><section id="op" class="panel" style="display:none"><div id="orders" class="table"></div></section></main><div id="toast" class="toast"></div><script>const API='https://telegram-monetag.onrender.com';let pass='',editing=null,products=[],orders=[],gallery=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));function headers(){return {'X-Admin-Password':pass,'Content-Type':'application/json'}}function note(x){$('msg').textContent=x}function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}async function login(){pass=$('pw').value.trim();if(pass)refresh()}async function refresh(){try{let r=await fetch(API+'/api/fashion/admin/stats',{headers:headers()});if(!r.ok)return note('❌ Password ভুল বা backend unavailable');let s=await r.json();$('pc').textContent=s.products;$('oc').textContent=s.orders;$('pending').textContent=s.pending;$('sales').textContent='৳'+Number(s.sales).toLocaleString();let p=await fetch(API+'/api/fashion/admin/products',{headers:headers()});products=(await p.json()).items||[];let o=await fetch(API+'/api/fashion/admin/orders',{headers:headers()});orders=(await o.json()).items||[];renderProducts();renderOrders();note('✅ Logged in')}catch(e){note('❌ Backend unavailable: '+e.message)}}function tab(x){$('pp').style.display=x==='p'?'block':'none';$('op').style.display=x==='o'?'block':'none'}function openForm(p){editing=p?.id||null;gallery=[];$('form').classList.add('show');$('name').value=p?.name||'';$('category').value=p?.category||'1 Piece';$('price').value=p?.price||'';$('old').value=p?.old_price||'';$('stock').value=p?.stock??10;$('image').value=p?.image||'';$('desc').value=p?.description||'';$('files').value='';let g=p?.gallery||[];if(!g.length&&p?.image)g=[p.image];gallery=g.slice(0,6);renderGallery();$('formTitle').textContent=editing?'Edit Product':'Add Product'}function closeForm(){editing=null;gallery=[];$('form').classList.remove('show')}function renderGallery(){let box=$('gallery');box.innerHTML=gallery.map((src,i)=>'<div class="gitem"><img src="'+esc(src)+'"><button class="remove" type="button" onclick="removeGallery('+i+')">×</button><small>'+(i===0?'⭐ Cover • ':'')+'Photo '+(i+1)+'</small></div>').join('');$('photoCount').textContent=gallery.length}function removeGallery(i){gallery.splice(i,1);renderGallery()}function resizeImage(file){return new Promise((resolve,reject)=>{let fr=new FileReader();fr.onload=()=>{let im=new Image();im.onload=()=>{let max=1200,w=im.width,h=im.height;if(Math.max(w,h)>max){if(w>=h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',.82))};im.onerror=reject;im.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)})}async function pickFiles(input){let files=[...input.files].slice(0,6-gallery.length);if(!files.length)return;note('⏳ ছবি প্রস্তুত হচ্ছে...');for(let f of files){if(!f.type.startsWith('image/'))continue;try{gallery.push(await resizeImage(f))}catch(e){}}input.value='';renderGallery();note('✅ ছবি ready — Save Product চাপো');toast(gallery.length+'টি ছবি selected')}async function save(){try{let g=gallery.slice(0,6),url=$('image').value.trim();if(url&&!g.includes(url))g.unshift(url);g=g.slice(0,6);let img=url||g[0]||'';let b={name:$('name').value.trim(),category:$('category').value,price:Number($('price').value),old_price:Number($('old').value||0),stock:Number($('stock').value||0),image:img,gallery:g,description:$('desc').value.trim()};if(!b.name||!b.price||!img)return note('❌ Name, Price এবং অন্তত ১টি ছবি দিন');note('⏳ Product save হচ্ছে...');let endpoint=editing?API+'/api/fashion/admin/products/'+editing:API+'/api/fashion/admin/products';let r=await fetch(endpoint,{method:editing?'PUT':'POST',headers:headers(),body:JSON.stringify(b)});let data=await r.json().catch(()=>({}));if(!r.ok)return note('❌ Save failed ('+r.status+'): '+(data.error||'server error'));closeForm();await refresh();toast('✅ Product saved')}catch(e){note('❌ Save failed: '+e.message)}}async function del(id){if(!confirm('Delete করবেন?'))return;let r=await fetch(API+'/api/fashion/admin/products/'+id,{method:'DELETE',headers:headers()});if(!r.ok)return note('❌ Delete failed');refresh()}function renderProducts(){$('products').innerHTML='<table><tr><th>Cover</th><th>Product</th><th>Gallery</th><th>Price</th><th>Stock</th><th>Action</th></tr>'+products.map(p=>'<tr><td>'+(p.image?'<img class="thumb" src="'+esc(p.image)+'">':'—')+'</td><td><b>'+esc(p.name)+'</b><br>'+esc(p.category)+'</td><td>'+(p.gallery?.length||0)+' photos</td><td>৳'+Number(p.price).toLocaleString()+'</td><td>'+p.stock+'</td><td><div class="actions"><button class="btn" onclick="editById('+p.id+')">Edit</button><button class="btn danger" onclick="del('+p.id+')">Delete</button></div></td></tr>').join('')+'</table>'}function editById(id){let p=products.find(x=>Number(x.id)===Number(id));if(p)openForm(p)}function renderOrders(){$('orders').innerHTML='<table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>'+orders.map(o=>'<tr><td>#'+o.id+'</td><td>'+esc(o.customer)+'<br>'+esc(o.phone)+'<br>'+esc(o.address)+'</td><td>'+o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')+'</td><td>৳'+Number(o.total).toLocaleString()+'</td><td><select onchange="status('+o.id+',this.value)">'+['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join('')+'</table>'}async function status(id,s){await fetch(API+'/api/fashion/admin/orders/'+id,{method:'PUT',headers:headers(),body:JSON.stringify({status:s})});refresh()}$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
