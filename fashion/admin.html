<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fashion Store • Admin</title>
<style>
:root{--ink:#18151a;--muted:#746d75;--line:#eee7eb;--soft:#fff7fa;--accent:#d94672;--accent2:#a82f55;--green:#16805b;--red:#c73535;--shadow:0 16px 45px rgba(35,20,28,.08)}*{box-sizing:border-box}body{margin:0;background:#faf8f9;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1280px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#171318,#d94672);display:grid;place-items:center;color:#fff;font-size:23px}.brand h1{font-size:22px;margin:0}.brand p{margin:3px 0;color:var(--muted);font-size:12px}.login{display:flex;gap:8px;width:380px;max-width:100%}input,select,textarea,button{font:inherit;border-radius:11px;border:1px solid var(--line);padding:11px 12px}input,select,textarea{background:#fff;color:var(--ink);outline:none;width:100%}button{background:var(--ink);color:#fff;cursor:pointer;font-weight:750}button:hover{opacity:.92}.pink{background:var(--accent)}.ghost{background:#fff;color:var(--ink)}.danger{background:#fff;color:var(--red);border-color:#f3caca}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:18px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:7px}.tabs{display:flex;gap:8px;margin-bottom:15px;overflow:auto}.tabs button{white-space:nowrap}.tabs button.active{background:var(--accent)}.panel{padding:18px;margin-bottom:18px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.panel h2{margin:0;font-size:17px}.hint{color:var(--muted);font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}th{color:var(--muted);font-weight:650}.money{font-weight:800}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:var(--soft);color:var(--accent2);font-size:11px;font-weight:750}.status{padding:7px 9px;border-radius:9px;background:#fff}.actions{display:flex;gap:6px}.actions button{padding:8px 10px;font-size:11px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.full{grid-column:1/-1}.field label{display:block;font-size:11px;color:var(--muted);margin:0 0 5px}.product-form{display:none;background:#fff7fa;border:1px solid #f3dce4;padding:15px;border-radius:15px;margin-bottom:15px}.product-form.show{display:block}.form-actions{display:flex;gap:8px;margin-top:12px}.msg{min-height:20px;color:var(--accent2);font-size:12px;margin:4px 0}.thumb{width:42px;height:52px;border-radius:8px;object-fit:cover;background:#f0eaed}.empty{text-align:center;color:var(--muted);padding:25px}.searchbar{max-width:320px}.order-items{max-width:330px;line-height:1.5}.mobile-note{display:none}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.login{width:100%}}@media(max-width:600px){.app{padding:13px}.grid{grid-template-columns:1fr 1fr}.stat{padding:14px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:13px}.mobile-note{display:block;color:var(--muted);font-size:11px;margin-top:7px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="logo">👗</div><div><h1>Fashion Store Admin</h1><p>Products, inventory & orders</p></div></div><div class="login"><input id="pw" type="password" placeholder="Admin password"><button onclick="login()">Login</button></div></header>
<div id="msg" class="msg">Admin password দিয়ে Login করো।</div>
<section class="grid"><div class="stat"><span>🛍️ Products</span><strong id="productCount">—</strong></div><div class="stat"><span>📦 Orders</span><strong id="orderCount">—</strong></div><div class="stat"><span>⏳ Pending</span><strong id="pendingCount">—</strong></div><div class="stat"><span>💰 Sales</span><strong id="salesTotal">—</strong></div></section>
<nav class="tabs"><button id="tabProducts" class="active" onclick="showTab('products')">Products</button><button id="tabOrders" onclick="showTab('orders')">Orders</button></nav>
<section id="productsPanel" class="panel"><div class="panel-head"><div><h2>Product Management</h2><span class="hint">Add, edit, delete and control stock</span></div><button class="pink" onclick="openForm()">＋ Add Product</button></div>
<div id="productForm" class="product-form"><div class="formgrid"><div class="field"><label>Product name</label><input id="fName" placeholder="Elegant Three Piece"></div><div class="field"><label>Category</label><select id="fCategory"><option>1 Piece</option><option>2 Piece</option><option>3 Piece</option><option>Abaya</option><option>Offer</option></select></div><div class="field"><label>Sale price (৳)</label><input id="fPrice" type="number" min="0" step="1"></div><div class="field"><label>Old price (৳)</label><input id="fOld" type="number" min="0" step="1"></div><div class="field"><label>Stock</label><input id="fStock" type="number" min="0" step="1" value="10"></div><div class="field"><label>Image URL</label><input id="fImage" placeholder="https://..."></div><div class="field full"><label>Description</label><textarea id="fDescription" rows="3" placeholder="Product details, fabric, size..."></textarea></div></div><div class="form-actions"><button class="pink" onclick="saveProduct()">Save Product</button><button class="ghost" onclick="closeForm()">Cancel</button></div></div>
<div class="table-wrap" id="products"></div></section>
<section id="ordersPanel" class="panel" style="display:none"><div class="panel-head"><div><h2>Order Management</h2><span class="hint">Review customer orders and update status</span></div><input class="searchbar" id="orderSearch" placeholder="Search customer / phone..." oninput="renderOrders()"></div><div class="table-wrap" id="orders"></div><div class="mobile-note">Mobile-এ table horizontally scroll করা যাবে।</div></section>
</main>
<script>
let password='',editingId=null,products=[],orders=[];
const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const headers=()=>({'X-Admin-Password':password,'Content-Type':'application/json'});
function note(t){document.getElementById('msg').textContent=t}
async function login(){password=document.getElementById('pw').value.trim();if(!password)return note('Password দাও।');await refresh()}
async function refresh(){let r=await fetch('/api/fashion/admin/stats',{headers:headers()});if(!r.ok)return note('❌ Password ভুল অথবা access denied');let s=await r.json();document.getElementById('productCount').textContent=s.products;document.getElementById('orderCount').textContent=s.orders;document.getElementById('pendingCount').textContent=s.pending;document.getElementById('salesTotal').textContent='৳'+Number(s.sales).toLocaleString('en-IN');let p=await fetch('/api/fashion/admin/products',{headers:headers()});products=(await p.json()).items||[];let o=await fetch('/api/fashion/admin/orders',{headers:headers()});orders=(await o.json()).items||[];renderProducts();renderOrders();note('✅ Dashboard ready')}
function showTab(t){document.getElementById('productsPanel').style.display=t==='products'?'block':'none';document.getElementById('ordersPanel').style.display=t==='orders'?'block':'none';document.getElementById('tabProducts').classList.toggle('active',t==='products');document.getElementById('tabOrders').classList.toggle('active',t==='orders')}
function openForm(p){editingId=p?.id||null;document.getElementById('productForm').classList.add('show');document.getElementById('fName').value=p?.name||'';document.getElementById('fCategory').value=p?.category||'1 Piece';document.getElementById('fPrice').value=p?.price??'';document.getElementById('fOld').value=p?.old_price??'';document.getElementById('fStock').value=p?.stock??10;document.getElementById('fImage').value=p?.image||'';document.getElementById('fDescription').value=p?.description||'';window.scrollTo({top:180,behavior:'smooth'})}
function closeForm(){editingId=null;document.getElementById('productForm').classList.remove('show')}
async function saveProduct(){let body={name:fName.value.trim(),category:fCategory.value,price:Number(fPrice.value),old_price:Number(fOld.value||0),stock:Number(fStock.value||0),image:fImage.value.trim(),description:fDescription.value.trim()};if(!body.name||!body.price)return note('Product name ও price required।');let url=editingId?'/api/fashion/admin/products/'+editingId:'/api/fashion/admin/products';let r=await fetch(url,{method:editingId?'PUT':'POST',headers:headers(),body:JSON.stringify(body)});if(!r.ok)return note('❌ Product save failed');closeForm();note('✅ Product saved');refresh()}
async function delProduct(id){if(!confirm('এই product delete করবে?'))return;let r=await fetch('/api/fashion/admin/products/'+id,{method:'DELETE',headers:headers()});if(r.ok){note('✅ Product deleted');refresh()}else note('❌ Delete failed')}
function renderProducts(){document.getElementById('products').innerHTML=products.length?'<table><thead><tr><th>Image</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th>Actions</th></tr></thead><tbody>'+products.map(p=>`<tr><td>${p.image?`<img class="thumb" src="${esc(p.image)}" onerror="this.style.visibility='hidden'">`:'—'}</td><td><b>${esc(p.name)}</b><br><span class="hint">#${p.id}</span></td><td><span class="pill">${esc(p.category)}</span></td><td class="money">৳${Number(p.price).toLocaleString('en-IN')}</td><td>${p.stock}</td><td>${p.active?'✅':'⛔'}</td><td><div class="actions"><button class="ghost" onclick='openForm(${JSON.stringify(p).replace(/</g,'\\u003c')})'>Edit</button><button class="danger" onclick="delProduct(${p.id})">Delete</button></div></td></tr>`).join('')+'</tbody></table>':'<div class="empty">No products yet. Add your first product.</div>'}
function renderOrders(){let q=(document.getElementById('orderSearch').value||'').toLowerCase();let a=orders.filter(o=>(o.customer+' '+o.phone).toLowerCase().includes(q));document.getElementById('orders').innerHTML=a.length?'<table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>'+a.map(o=>`<tr><td><b>#${o.id}</b></td><td><b>${esc(o.customer)}</b><br>${esc(o.phone)}<br><span class="hint">${esc(o.address)}</span></td><td class="order-items">${o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</td><td class="money">৳${Number(o.total).toLocaleString('en-IN')}</td><td><select class="status" onchange="updateStatus(${o.id},this.value)">${['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td>${new Date(o.created_at*1000).toLocaleString()}</td><td><button class="ghost" onclick="updateStatus(${o.id},'${o.status}')">Save</button></td></tr>`).join('')+'</tbody></table>':'<div class="empty">No orders found.</div>'}
async function updateStatus(id,status){let r=await fetch('/api/fashion/admin/orders/'+id,{method:'PUT',headers:headers(),body:JSON.stringify({status})});if(r.ok){note('✅ Order #'+id+' updated');refresh()}else note('❌ Order update failed')}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
