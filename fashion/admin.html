<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fashion Store Admin</title><style>body{margin:0;background:#faf7f8;color:#18151a;font:14px Arial}.app{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.login{display:flex;gap:8px}.panel,.stat{background:#fff;border:1px solid #eee;border-radius:16px;padding:16px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{font-size:24px;display:block;margin-top:6px}.tabs button,.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#18151a;color:#fff}.pink{background:#d94672!important}.form{display:none;background:#fff5f8;padding:14px;border-radius:14px}.form.show{display:block}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:11px;color:#756d74;display:block;margin-bottom:4px}input,select,textarea{width:100%;padding:10px;border:1px solid #eadfe4;border-radius:9px;box-sizing:border-box}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gitem{display:flex;gap:5px}.thumb{width:55px;height:60px;object-fit:cover;border-radius:8px;background:#eee}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:750px}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:12px}.actions{display:flex;gap:6px}.danger{background:#fff!important;color:#c73535!important;border:1px solid #f1cccc!important}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}.gallery{grid-template-columns:1fr}}</style></head><body><main class="app"><header class="top"><div><h1>👗 Fashion Store Admin</h1><small>Products & Orders</small></div><div class="login"><input id="pw" type="password" placeholder="Admin password"><button class="btn" onclick="login()">Login</button></div></header><p id="msg">Login করো।</p><section class="stats"><div class="stat">Products<b id="pc">—</b></div><div class="stat">Orders<b id="oc">—</b></div><div class="stat">Pending<b id="pending">—</b></div><div class="stat">Sales<b id="sales">—</b></div></section><div><button class="btn pink" onclick="tab('p')">Products</button> <button class="btn" onclick="tab('o')">Orders</button></div><section id="pp" class="panel"><button class="btn pink" onclick="openForm()">＋ Add Product</button><div id="form" class="form"><h3 id="formTitle">Add Product</h3><div class="fields"><div><label>Name</label><input id="name"></div><div><label>Category</label><select id="category"><option>1 Piece</option><option>2 Piece</option><option>3 Piece</option><option>Abaya</option><option>Offer</option></select></div><div><label>Sale Price</label><input id="price" type="number"></div><div><label>Old Price</label><input id="old" type="number"></div><div><label>Stock</label><input id="stock" type="number"></div><div><label>Main/Cover Image URL</label><input id="image" placeholder="https://..."></div><div class="full"><label>Gallery Images — ৪/৫টি পর্যন্ত URL</label><div id="gallery" class="gallery"></div><button type="button" class="btn" onclick="addGallery()">＋ Add Gallery Image</button></div><div class="full"><label>Description</label><textarea id="desc" rows="4"></textarea></div></div><p>প্রথম ছবিটাই customer-এর সামনে cover হিসেবে দেখাবে।</p><button class="btn pink" onclick="save()">Save Product</button> <button class="btn" onclick="closeForm()">Cancel</button></div><div id="products" class="table"></div></section><section id="op" class="panel" style="display:none"><div id="orders" class="table"></div></section></main><script>let pass='',editing=null,products=[],orders=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));function headers(){return {'X-Admin-Password':pass,'Content-Type':'application/json'}}function note(x){$('msg').textContent=x}async function login(){pass=$('pw').value.trim();if(pass)refresh()}async function refresh(){let r=await fetch('/api/fashion/admin/stats',{headers:headers()});if(!r.ok)return note('❌ Password ভুল');let s=await r.json();$('pc').textContent=s.products;$('oc').textContent=s.orders;$('pending').textContent=s.pending;$('sales').textContent='৳'+Number(s.sales).toLocaleString();let p=await fetch('/api/fashion/admin/products',{headers:headers()});products=(await p.json()).items||[];let o=await fetch('/api/fashion/admin/orders',{headers:headers()});orders=(await o.json()).items||[];renderProducts();renderOrders();note('✅ Logged in')}function tab(x){$('pp').style.display=x==='p'?'block':'none';$('op').style.display=x==='o'?'block':'none'}function openForm(p){editing=p?.id||null;$('form').classList.add('show');$('name').value=p?.name||'';$('category').value=p?.category||'1 Piece';$('price').value=p?.price||'';$('old').value=p?.old_price||'';$('stock').value=p?.stock||10;$('image').value=p?.image||'';$('desc').value=p?.description||'';$('gallery').innerHTML='';let g=p?.gallery||[];if(!g.length&&p?.image)g=[p.image];g.forEach(x=>addGallery(x));if(!g.length) addGallery();$('formTitle').textContent=editing?'Edit Product':'Add Product'}function closeForm(){editing=null;$('form').classList.remove('show')}function addGallery(v=''){let d=document.createElement('div');d.className='gitem';d.innerHTML='<input class="gurl" placeholder="https://image..." value="'+esc(v)+'"><button type="button" class="btn danger" onclick="this.parentElement.remove()">×</button>'; $('gallery').appendChild(d)}async function save(){let g=[...document.querySelectorAll('.gurl')].map(x=>x.value.trim()).filter(Boolean).slice(0,6),img=$('image').value.trim()||g[0]||'';if(img&&!g.includes(img))g.unshift(img);let b={name:$('name').value.trim(),category:$('category').value,price:Number($('price').value),old_price:Number($('old').value||0),stock:Number($('stock').value||0),image:img,gallery:g,description:$('desc').value.trim()};let url=editing?'/api/fashion/admin/products/'+editing:'/api/fashion/admin/products';let r=await fetch(url,{method:editing?'PUT':'POST',headers:headers(),body:JSON.stringify(b)});if(!r.ok)return note('❌ Save failed');closeForm();refresh()}async function del(id){if(!confirm('Delete করবেন?'))return;await fetch('/api/fashion/admin/products/'+id,{method:'DELETE',headers:headers()});refresh()}function renderProducts(){$('products').innerHTML='<table><tr><th>Cover</th><th>Product</th><th>Gallery</th><th>Price</th><th>Stock</th><th>Action</th></tr>'+products.map(p=>'<tr><td>'+ (p.image?'<img class="thumb" src="'+esc(p.image)+'">':'—')+'</td><td><b>'+esc(p.name)+'</b><br>'+esc(p.category)+'</td><td>'+(p.gallery?.length||0)+' photos</td><td>৳'+Number(p.price).toLocaleString()+'</td><td>'+p.stock+'</td><td><div class="actions"><button class="btn" onclick=\'openForm('+JSON.stringify(p).replace(/</g,'\\u003c')+')\'>Edit</button><button class="btn danger" onclick="del('+p.id+')">Delete</button></div></td></tr>').join('')+'</table>'}function renderOrders(){$('orders').innerHTML='<table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>'+orders.map(o=>'<tr><td>#'+o.id+'</td><td>'+esc(o.customer)+'<br>'+esc(o.phone)+'<br>'+esc(o.address)+'</td><td>'+o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')+'</td><td>৳'+Number(o.total).toLocaleString()+'</td><td><select onchange="status('+o.id+',this.value)">'+['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join('')+'</table>'}async function status(id,s){await fetch('/api/fashion/admin/orders/'+id,{method:'PUT',headers:headers(),body:JSON.stringify({status:s})});refresh()}$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
