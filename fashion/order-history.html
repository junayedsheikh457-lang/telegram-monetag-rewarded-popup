<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUXÉRA Order History</title><style>body{margin:0;background:#faf7f8;color:#211b20;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.panel{background:#fff;border:1px solid #eadfe4;border-radius:16px;padding:16px;margin-top:16px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#18151a;color:#fff;cursor:pointer}.pink{background:#d94672}input,select{padding:10px;border:1px solid #eadfe4;border-radius:8px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;font-size:12px}.muted{color:#766d74;font-size:12px}.cancel{background:#fff;color:#b42323;border:1px solid #efcaca}.status{font-weight:700}.msg{margin:10px 0;color:#a52b55}</style></head><body><main class="wrap"><header class="top"><div><h1>📦 LUXÉRA Order History</h1><div class="muted">Customer, products, amount, date/time and status</div></div><div><input id="pw" type="password" placeholder="Admin password"><button class="btn pink" onclick="load()">Login / Refresh</button></div></header><div id="msg" class="msg">Admin password দিয়ে Login করো।</div><section class="panel"><div id="table" class="table">No data</div></section></main><script>const API='https://telegram-monetag.onrender.com';let pass='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));function dt(v){if(!v)return '—';return new Date(Number(v)*1000).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})}async function load(){pass=$('pw').value.trim();if(!pass)return;$('msg').textContent='Loading...';let r=await fetch(API+'/api/fashion/admin/orders',{headers:{'X-Admin-Password':pass}});if(!r.ok){$('msg').textContent='❌ Password ভুল বা server unavailable';return}let d=await r.json();$('msg').textContent='✅ History loaded';$('table').innerHTML='<table><tr><th>Order</th><th>Customer</th><th>Products</th><th>Total</th><th>Ordered At</th><th>Updated At</th><th>Status / Action</th></tr>'+d.items.map(o=>'<tr><td>#'+o.id+'</td><td><b>'+esc(o.customer)+'</b><br>'+esc(o.phone)+'<br>'+esc(o.address)+'</td><td>'+o.items.map(i=>esc(i.name)+' × '+i.qty+'<br>৳'+Number(i.price).toLocaleString()+' × '+i.qty+' = ৳'+Number(i.line_total).toLocaleString()).join('<hr>')+'</td><td><b>৳'+Number(o.total).toLocaleString()+'</b></td><td>'+dt(o.created_at)+'</td><td>'+dt(o.updated_at)+'</td><td><span class="status">'+esc(o.status)+'</span><br><br><select id="s'+o.id+'"><option>Pending</option><option>Confirmed</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select><br><br><button class="btn cancel" onclick="change('+o.id+')">Update / Cancel</button></td></tr>').join('')+'</table>'}async function change(id){let s=$('s'+id).value;if(!confirm('Order #'+id+' status '+s+' করবেন?'))return;let r=await fetch(API+'/api/fashion/admin/orders/'+id,{method:'PUT',headers:{'X-Admin-Password':pass,'Content-Type':'application/json'},body:JSON.stringify({status:s})});if(!r.ok){$('msg').textContent='❌ Update failed';return}load()}$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')load()});</script></body></html>
